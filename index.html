<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Twits 읽기 튜터 — 18장 · 19~20장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EA; --card:#FFFFFF; --forest:#2F6B4F; --forest-dark:#204C38;
    --leaf:#7FB88A; --peach:#FF8C5A; --peach-dark:#E96E3A;
    --chip-bg:#FFF1D6; --chip-border:#F0C888; --chip-active:#FFD8A0;
    --ink:#3B2E2A; --muted:#9C8C7D; --faint:#C9BEB0; --link:#4A90A4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 15% 0%, #EAF6EC 0%, var(--cream) 45%);
    min-height:100vh; font-family:'Gowun Dodum', sans-serif; color:var(--ink);
    display:flex; justify-content:center; padding: 18px 12px 40px;
  }
  .app{ width:100%; max-width:540px; }
  header{ text-align:center; margin-bottom:14px; }
  .badge{
    font-family:'Gaegu', sans-serif; font-size:15px; color:var(--forest);
    background:#E4F3E6; border-radius:20px; padding:4px 14px; display:inline-block;
    margin-bottom:8px; font-weight:700;
  }
  h1{ font-family:'Gaegu', sans-serif; font-size:26px; margin:0 0 2px; color:var(--forest-dark); font-weight:700; }
  .sub{ font-size:13px; color:var(--muted); margin:0; }

  .progress-row{ display:flex; align-items:center; justify-content:center; gap:6px; margin:14px 0 10px; }
  .dot{ width:8px;height:8px;border-radius:50%; background:#E3D8C8; transition:all .2s; }
  .dot.done{background:var(--leaf);}
  .dot.current{background:var(--peach);width:20px;border-radius:5px;}

  .card{
    background:var(--card); border-radius:22px; padding:22px 18px 18px;
    box-shadow:0 8px 24px rgba(60,40,20,0.08); border:1px solid #F1E6D2;
  }

  .sentence{
    font-family:'Nunito', sans-serif; font-weight:800; font-size:22px;
    line-height:1.5; letter-spacing:0.2px; text-align:left;
    display:flex; flex-wrap:wrap; align-items:flex-start; row-gap:6px;
  }
  .word-unit{ display:flex; flex-direction:column; align-items:center; }
  .word{
    display:inline-block; cursor:pointer; padding:2px 3px; border-radius:8px;
    transition:background .15s, transform .1s; -webkit-tap-highlight-color: transparent;
  }
  .word:active{ transform: scale(0.94); }
  .word.active{ background:var(--chip-active); box-shadow:0 0 0 2px var(--peach) inset; }
  .punct{ font-weight:800; align-self:flex-start; padding-top:2px; }
  .gloss{
    display:none; font-family:'Gowun Dodum', sans-serif; font-weight:400; font-size:11px;
    line-height:1.25; color:var(--forest); max-width:92px; text-align:center; margin-top:2px;
  }
  .sentence.show-gloss .gloss{ display:block; }

  .link-mark{
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--link); font-size:20px; font-weight:900; padding:0 1px; margin:0 -2px;
    -webkit-tap-highlight-color: transparent; align-self:flex-start;
  }
  .link-mark.seen{ color:var(--peach-dark); }

  .hint{ margin-top:10px; font-size:12.5px; color:var(--muted); text-align:center; }

  .listen-row{ display:flex; justify-content:center; margin-top:10px; }
  .listen-btn{
    border:none; background:var(--forest); color:white; font-family:'Gaegu', sans-serif;
    font-weight:700; font-size:15px; padding:9px 18px; border-radius:20px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .listen-btn:active{ transform: scale(0.96); }
  .word-listen-btn{
    border:none; background:var(--peach); color:white; font-size:14px;
    width:30px; height:30px; border-radius:50%; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .word-listen-btn:active{ transform: scale(0.9); }

  .helper{
    margin-top:16px; border-radius:18px; background:#FDF3E3;
    border:2px dashed var(--chip-border); padding:16px 16px 12px; min-height:90px;
  }
  .helper.placeholder{
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:14px; text-align:center; min-height:78px;
  }
  .helper-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .word-en{ font-family:'Nunito', sans-serif; font-weight:900; font-size:20px; color:var(--forest-dark); }
  .ipa-full{ font-size:22px; color:var(--peach-dark); font-weight:700; letter-spacing:0.5px; }

  .phon-row{ display:flex; gap:8px; overflow-x:auto; margin-top:12px; padding-bottom:4px; }
  .phon-chip{
    flex:0 0 auto; min-width:104px; background:#FFFFFF; border:1.5px solid var(--chip-border);
    border-radius:14px; padding:8px 8px 6px; text-align:center;
  }
  .phon-svgs{ display:flex; align-items:center; justify-content:center; gap:2px; }
  .phon-arrow{ font-size:14px; color:var(--muted); }
  .phon-sym{ font-size:20px; font-weight:800; color:var(--forest-dark); font-family:'Nunito', sans-serif; margin-top:2px; }
  .phon-desc{ font-size:11px; color:var(--ink); margin-top:3px; line-height:1.35; }

  .meaning-line{ font-size:14.5px; color:var(--ink); margin-top:12px; }
  .meaning-line b{ color:var(--forest); }

  .kor-toggle{ margin-top:10px; font-size:12px; color:var(--faint); text-decoration:underline; cursor:pointer; display:inline-block; }
  .kor-hint{ display:none; margin-top:4px; font-size:13px; color:var(--muted); background:#F4F0E9; border-radius:10px; padding:6px 10px; }
  .kor-hint.show{ display:block; }

  .link-type-tag{
    display:inline-block; font-size:11px; font-family:'Gaegu', sans-serif; font-weight:700;
    color:#fff; background:var(--link); border-radius:10px; padding:2px 10px; margin-bottom:8px;
  }
  .link-phrase{ font-family:'Nunito', sans-serif; font-weight:900; font-size:20px; color:var(--forest-dark); display:flex; align-items:center; gap:8px; }
  .link-sound{ font-size:19px; font-weight:700; color:var(--peach-dark); margin-top:6px; }
  .link-desc{ font-size:14px; color:var(--ink); margin-top:6px; line-height:1.5; }


  .trans-box{ display:none; margin-top:10px; background:#F4FBF5; border:1px solid #CFE8D3; border-radius:14px;
    padding:12px 14px; font-size:15.5px; line-height:1.65; color:var(--forest-dark); }
  .trans-box.show{ display:block; }
  .rec-row{ display:flex; justify-content:center; gap:8px; margin-top:10px; }
  .rec-btn{ border:none; color:#fff; font-family:'Gaegu', sans-serif; font-weight:700; font-size:15px;
    padding:9px 16px; border-radius:20px; cursor:pointer; background:var(--peach); }
  .rec-btn.play{ background:var(--link); }
  .rec-btn.recording{ background:#D9534F; animation: recpulse 1s infinite; }
  .rec-btn.app{ background:var(--forest); }
  .rec-btn.load{ background:#8E7CC3; }
  .rec-btn:disabled{ opacity:.4; }
  @keyframes recpulse{ 0%{transform:scale(1);} 50%{transform:scale(1.06);} 100%{transform:scale(1);} }
  .rec-status{ text-align:center; font-size:12.5px; color:var(--muted); margin-top:6px; min-height:16px; }

  .chtabs{ display:flex; gap:8px; justify-content:center; margin:2px 0 8px; }
  .ch-btn{ border:2px solid #E3D8C8; background:#fff; color:var(--muted); font-family:'Gaegu', sans-serif;
    font-weight:700; font-size:17px; padding:7px 20px; border-radius:20px; cursor:pointer; }
  .ch-btn.active{ border-color:var(--peach); background:#FFEFE6; color:var(--peach-dark); }
  .rec-btn.judge{ background:#8E7CC3; }
  .rec-btn.big{ font-size:17px; padding:12px 26px; }
  .fallback{ text-align:center; font-size:12px; color:var(--muted); margin-top:8px; }
  .fallback summary{ cursor:pointer; }
  .rec-btn.recording{ background:#D9534F; }
  .rec-status.judge-status{ font-weight:700; }
  .rec-status.judge-status.pass{ color:var(--forest); }
  .rec-status.judge-status.fail{ color:var(--peach-dark); }
  .rec-status.heard{ font-family:'Nunito', sans-serif; font-size:12px; color:#9C8C7D; }
  .gate-toggle{ display:block; text-align:center; font-size:12px; color:var(--muted); margin-top:8px; }
  .word-unit.mismatch .word{ background:#FFE1D6; box-shadow:0 0 0 2px var(--peach-dark) inset; }
  .word-unit.ok .word{ background:#E4F3E6; }
  .skip-link{ display:block; text-align:center; font-size:12px; color:var(--faint); text-decoration:underline; margin-top:6px; cursor:pointer; }
  .nav-btn.next.locked{ opacity:.5; }

  .app{ max-width:660px; }
  .stage{ display:flex; gap:6px; align-items:flex-start; }
  .stage .card{ flex:1; min-width:0; }
  .side-btn{ position:sticky; top:36vh; flex:0 0 42px; width:42px; height:96px; border:none; border-radius:21px;
    background:var(--peach); color:#fff; font-size:22px; cursor:pointer; box-shadow:0 4px 10px rgba(255,140,90,.35);
    -webkit-tap-highlight-color: transparent; }
  .side-btn:active{ transform:scale(.94); }
  .side-btn:disabled{ opacity:.35; box-shadow:none; }
  .side-btn.locked{ background:#B9AFA3; box-shadow:none; }
  .act-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; }
  .act-btn{ border:none; color:#fff; font-family:'Gaegu', sans-serif; font-weight:700; font-size:15px;
    padding:10px 14px; border-radius:20px; cursor:pointer; }
  .act-btn.listen{ background:var(--forest); } .act-btn.rec{ background:var(--peach); }
  .act-btn.play{ background:var(--link); } .act-btn.judge{ background:#8E7CC3; }
  .act-btn.recording{ background:#D9534F; animation: recpulse 1s infinite; }
  .act-btn:disabled{ opacity:.4; } .act-btn:active{ transform:scale(.96); }
  .translate-btn{
    margin-top:14px; width:100%; border:none; background:#E4F3E6; color:var(--forest-dark);
    font-family:'Gaegu', sans-serif; font-weight:700; font-size:16px; padding:11px; border-radius:14px; cursor:pointer;
  }
  .translate-btn:active{ background:#D6ECD9; }

  .nav-row{ display:flex; gap:10px; margin-top:18px; }
  .nav-btn{
    flex:1; border:none; padding:14px 0; border-radius:16px;
    font-family:'Gaegu', sans-serif; font-weight:700; font-size:18px; cursor:pointer; color:white;
  }
  .nav-btn.prev{ background:#CFC3B2; }
  .nav-btn.next{ background:var(--peach); }
  .nav-btn:disabled{ opacity:0.45; }
  .nav-btn:active{ transform: scale(0.97); }


  .tabbar{ display:flex; gap:8px; justify-content:center; margin:6px 0 10px; }
  .tab-btn{
    border:none; background:#EFE6D6; color:var(--muted); font-family:'Gaegu', sans-serif;
    font-weight:700; font-size:16px; padding:8px 18px; border-radius:18px; cursor:pointer;
  }
  .tab-btn.active{ background:var(--forest); color:#fff; }
  #vocabView{ display:none; }
  .vcard{
    background:#fff; border:1px solid #F1E6D2; border-radius:22px; padding:26px 18px;
    box-shadow:0 8px 24px rgba(60,40,20,0.08); min-height:230px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; cursor:pointer; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  .vcard .en{ font-family:'Nunito', sans-serif; font-weight:900; font-size:34px; color:var(--forest-dark); line-height:1.3; word-break:break-word; }
  .vcard .en.long{ font-size:22px; line-height:1.5; }
  .vcard .ko{ font-size:24px; font-weight:700; color:var(--peach-dark); line-height:1.5; margin-top:6px; }
  .vcard .ko.long{ font-size:18px; }
  .vcard .taphint{ margin-top:14px; font-size:12.5px; color:var(--muted); }
  .vcard.flipped{ background:#FFF6EA; border-color:#F0C888; }
  .vrow{ display:flex; gap:8px; margin-top:12px; }
  .vbtn{
    flex:1; border:none; padding:12px 0; border-radius:14px; font-family:'Gaegu', sans-serif;
    font-weight:700; font-size:16px; cursor:pointer; color:#fff; background:#CFC3B2;
  }
  .vbtn.know{ background:var(--forest); } .vbtn.dunno{ background:var(--peach); }
  .vbtn.sound{ background:var(--link); } .vbtn:disabled{ opacity:.45; }
  .vbtn:active{ transform:scale(.97); }
  .vinfo{ text-align:center; margin-top:10px; font-size:13px; color:var(--muted); font-family:'Gaegu', sans-serif; }
  .counter{ text-align:center; margin-top:10px; font-size:13px; color:var(--muted); font-family:'Gaegu', sans-serif; }
  .legend{
    margin-top:10px; text-align:center; font-size:11px; color:var(--muted);
  }
  .legend b{ color:var(--link); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="badge">🐦🐒 로알드 달 『The Twits』 18장 · 19~20장</div>
    <h1>소리 내어 읽어봐요!</h1>
    <p class="sub">모르는 단어는 톡, 파란 물결(‿)은 이어지는 소리예요</p>
  </header>

    <div class="chtabs">
    <button class="ch-btn active" data-k="ch18">📗 18장</button>
    <button class="ch-btn" data-k="ch1920">📘 19~20장</button>
  </div>
  <div class="tabbar">
    <button class="tab-btn active" id="tabRead">📖 읽기</button>
    <button class="tab-btn" id="tabVocab">🃏 단어 외우기 (24)</button>
  </div>
  <div class="progress-row" id="progressRow"></div>

  <div class="stage">
  <button class="side-btn" id="prevBtn" aria-label="이전 문장">◀</button>
  <div class="card">
    <div class="sentence" id="sentenceBox"></div>
    <div class="legend"><b>‿</b> 표시를 누르면 단어들이 이어져서 나는 소리를 배울 수 있어요</div>
    <div class="hint">👉 먼저 소리 내서 읽어보고, 막히는 단어를 눌러보세요</div>
    <div class="act-row">
      <button class="act-btn listen" id="listenSentenceBtn">🔊 문장 듣기</button>
      <button class="act-btn rec" id="recBtn">🎙️ 녹음</button>
      <button class="act-btn play" id="recPlayBtn" disabled>▶ 내 목소리</button>
      <button class="act-btn judge" id="judgeBtn">🎤 읽기 검사</button>
    </div>
    <div class="rec-status" id="recStatus"></div>
    <div class="rec-status judge-status" id="judgeStatus"></div>
    <div class="rec-status heard" id="heardText"></div>
    <label class="gate-toggle"><input type="checkbox" id="gateChk" checked> 검사를 통과해야 다음으로 넘어가기</label>

    <div class="helper placeholder" id="helperBox">
      단어나 ‿ 표시를 톡 누르면 여기에 설명이 나와요
    </div>

    <button class="translate-btn" id="translateBtn">🌏 우리말 뜻 보기</button>
    <div class="trans-box" id="transBox"></div>
  </div>
  <button class="side-btn" id="nextBtn" aria-label="다음 문장">▶</button>
  </div>
  <div class="counter" id="counterText"></div>

  <div id="vocabView">
    <div class="vinfo" id="vInfo"></div>
    <div class="vcard" id="vCard"></div>
    <div class="vrow">
      <button class="vbtn sound" id="vSound">🔊 듣기</button>
      <button class="vbtn" id="vShuffle">🔀 섞기</button>
    </div>
    <div class="vrow">
      <button class="vbtn dunno" id="vDunno">몰라요 ✗</button>
      <button class="vbtn know" id="vKnow">알아요 ✓</button>
    </div>
    <div class="vrow">
      <button class="vbtn" id="vPrev">◀ 이전</button>
      <button class="vbtn" id="vNext">다음 ▶</button>
    </div>
    <div class="vrow"><button class="vbtn" id="vReview">몰라요만 다시 보기</button></div>
  </div>
</div>

const CHAPTERS = {"ch18": {"label": "18장", "title": "롤리 폴리 새의 도움", "sentences": [["Muggle Wump and his family longed to escape from the cage in Mr Twit's garden and go back to the African jungle where they came from.", "머글 웜프와 그의 가족은 트윗 아저씨네 정원의 우리에서 탈출해, 자기들이 태어난 아프리카 정글로 돌아가고 싶었어요."], ["They hated Mr and Mrs Twit for making their lives so miserable.", "원숭이들은 자기들을 이렇게 비참하게 만드는 트윗 부부가 너무 미웠어요."], ["They also hated them for what they did to the birds every Tuesday and Wednesday.", "화요일과 수요일마다 새들에게 하는 짓도 미웠고요."], ["'Fly away, birds!' they used to shout, jumping about in the cage and waving their arms.", "\"날아가, 새들아!\" 원숭이들은 우리 안에서 폴짝폴짝 뛰며 팔을 흔들고 이렇게 외치곤 했어요."], ["'Don't sit on that Big Dead Tree!", "\"저 큰 죽은 나무에 앉지 마!"], ["It's just been smeared all over with sticky glue!", "끈끈이 풀이 잔뜩 발라져 있어!"], ["Go and sit somewhere else!'", "다른 데 가서 앉아!\""], ["But these were English birds and they couldn't understand the weird African language the monkeys spoke.", "하지만 영국 새들은 원숭이들이 쓰는 이상한 아프리카 말을 알아듣지 못했어요."], ["So they took no notice and went on using The Big Dead Tree and getting caught for Mrs Twit's Bird Pie.", "그래서 신경도 쓰지 않고 계속 그 큰 죽은 나무에 앉다가, 트윗 아주머니의 새 파이가 되고 말았죠."], ["Then one day, a truly magnificent bird flew down out of the sky and landed on the monkey cage.", "그러던 어느 날, 정말 멋진 새 한 마리가 하늘에서 날아 내려와 원숭이 우리 위에 앉았어요."], ["'Good heavens!' cried all the monkeys together.", "\"세상에!\" 원숭이들이 다 같이 외쳤어요."], ["'It's the Roly Poly Bird!", "\"롤리 폴리 새잖아!"], ["What on earth are you doing over here in England, Roly Poly Bird?'", "도대체 영국에서 뭐 하고 있는 거야, 롤리 폴리?\""], ["Like the monkeys, the Roly Poly Bird came from Africa and he spoke the same language as they did.", "롤리 폴리 새도 원숭이들처럼 아프리카에서 왔고, 원숭이들과 같은 말을 썼어요."], ["'I've come for a holiday,' said the Roly Poly Bird.", "\"휴가를 왔어,\" 롤리 폴리 새가 말했어요."], ["'I like to travel.'", "\"난 여행을 좋아하거든.\""], ["He fluffed his marvellous coloured feathers and looked down rather grandly at the monkeys.", "그는 멋지고 알록달록한 깃털을 부풀리고, 꽤 위풍당당하게 원숭이들을 내려다보았어요."], ["'For most people,' he went on, 'flying away on holiday is very expensive, but I can fly anywhere in the world for nothing.'", "\"대부분의 사람들은,\" 그가 말을 이었어요. \"휴가를 멀리 날아가려면 돈이 아주 많이 들지만, 나는 세상 어디든 공짜로 날아갈 수 있어.\""], ["'Do you know how to talk to these English birds?'", "\"너 이 영국 새들이랑 말하는 법 알아?\""], ["Muggle Wump asked him.", "머글 웜프가 물었어요."], ["'Of course I do,' said the Roly Poly Bird.", "\"물론이지,\" 롤리 폴리 새가 말했어요."], ["'It's no good going to a country and not knowing the language.'", "\"어떤 나라에 가서 그 나라 말을 모르면 아무 소용 없잖아.\""], ["'Then we must hurry,' said Muggle Wump.", "\"그럼 서둘러야 해,\" 머글 웜프가 말했어요."], ["'Today is Tuesday and over there you can already see the revolting Mr Twit up the ladder painting sticky glue on all the branches of The Big Dead Tree.", "\"오늘은 화요일이라, 저기 역겨운 트윗 아저씨가 벌써 사다리 위에서 큰 죽은 나무의 가지마다 끈끈이 풀을 바르고 있는 게 보일 거야."], ["This evening when the birds come in to roost, you must warn them not to perch on that tree or they will be made into Bird Pie.'", "오늘 저녁 새들이 잠자리에 들러 오면, 저 나무에 앉지 말라고 경고해 줘. 안 그러면 새 파이가 될 테니까.\""], ["That evening, the Roly Poly Bird flew round and round The Big Dead Tree, singing out his warning.", "그날 저녁, 롤리 폴리 새는 큰 죽은 나무 둘레를 빙글빙글 돌면서 경고의 노래를 불러 주었어요."]], "links": {"0": [{"i": 7, "w1": "escape", "w2": "from", "type": "link", "typeLabel": "연음 (자음+모음이 이어짐)", "sound": "이스케이프프롬", "desc": "'escape'의 p 소리가 다음 소리와 부드럽게 이어져요"}, {"i": 17, "w1": "back", "w2": "to", "type": "link", "typeLabel": "연음 (자음+모음이 이어짐)", "sound": "백투", "desc": "'back'의 k 소리가 이어져 '백투'처럼 들려요"}], "1": [], "2": [{"i": 13, "w1": "and", "w2": "Wednesday.", "type": "link", "typeLabel": "연음 (자음+모음이 이어짐)", "sound": "앤웬즈데이", "desc": "'and'는 빠르게 '앤'처럼 줄여 이어 말해요"}], "3": [{"i": 7, "w1": "jumping", "w2": "about", "type": "link", "typeLabel": "연음 (자음+모음이 이어짐)", "sound": "점핑어바웃", "desc": "'jumping'의 ŋ 소리가 다음 모음과 이어져 '점핑어바웃'처럼 들려요"}], "4": [{"i": 1, "w1": "sit", "w2": "on", "type": "link", "typeLabel": "연음 (자음+모음이 이어짐)", "sound": "시톤", "desc": "'sit'의 t 소리가 다음 모음과 이어져 '시톤'처럼 들려요"}], "5": [{"i": 4, function mouthSVG(catKey){
  const p = CAT[catKey];
  if(!p) return '';
  const tx = p.tx, ty = p.ty;
  let lipsSVG = '', cavitySVG = '', toothSVG = '', tongueSVG = '';

  const head = `<path d="M40,20 C88,3 128,10 148,32 C158,44 168,50 172,58

    lipsSVG = `<path d="M140,82 Q158,74 168,84 Q158,94 140,88 Z" fill="#D98878" stroke="#8A5A34" stroke-width="1.5"/>`;

    toothSVG = `<rect x="148" y="80" width="3" height="4" fill="#fff"/><rect x="153" y="80" width="3" height="4" fill="#fff"/><rect x="158" y="80" width="3" height="4" fill="#fff"/>`;
  } else if(p.lips === 'teeth'){
    cavitySVG = `<rect x="144" y="78" width="18" height="16" rx="5" fill="#7A3030"/>`;

  } else {
    cavitySVG = `<rect x="144" y="78" width="18" height="18" rx="6" fill="#7A3030"/>`;

  }

  if(p.lips !== 'closed'){

      tongueSVG = `<ellipse cx="${tx}" cy="${ty}" rx="9" ry="5" fill="#E8747C" stroke="#B94F58" stroke-width="1.2"/>`;

      tongueSVG = `<ellipse cx="${tx}" cy="${ty}" rx="11" ry="8" fill="#E8747C" stroke="#B94F58" stroke-width="1.2"/>`;
    }
  }

  let nasalSVG = '';

                 <path d="M172,82 Q182,84 172,86" fill="none" stroke="#C9BEB0" stroke-width="1.2"/>`;

// ---------- speech ----------
let cachedVoices = [];
function loadVoices(){
  cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function pickEnglishVoice(){
  if(!cachedVoices.length) loadVoices();
  const enVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  return enVoices.find(v => /US|female|Samantha|Google US/i.test(v.name)) || enVoices[0] || cachedVoices[0] || null;
}
function speak(text, rate){
  if(!('speechSynthesis' in window)){
    alert('이 브라우저는 음성 읽기를 지원하지 않아요. 최신 크롬이나 사파리에서 열어보세요.');
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = rate || 0.85;
    const v = pickEnglishVoice();
    if(v) utter.voice = v;
    utter.onerror = () => {
      alert('소리가 안 나오면: 1) 무음 스위치/음량을 확인하고 2) 버튼을 한 번 더 눌러보고 3) 다운로드한 파일을 크롬이나 사파리 앱에서 직접 열어보세요.');
    };
    window.speechSynthesis.speak(utter);
    setTimeout(() => { if(window.speechSynthesis.paused) window.speechSynthesis.resume(); }, 150);
  }catch(e){
    alert('음성 재생 중 문제가 생겼어요. 다시 시도해 주세요.');
  }
}

const progressRow = document.getElementById('progressRow');
const listenSentenceBtn = document.getElementById('listenSentenceBtn');
listenSentenceBtn.addEventListener('click', () => {
  const [text] = sentences[current];
  speak(text, 0.43);
});

function buildDots(){
  progressRow.innerHTML = '';
  sentences.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === current ? ' current' : (i < current ? ' done' : ''));
    progressRow.appendChild(d);
  });
}

function lookupKey(token){
  const match = token.match(/[A-Za-z']+/);
  if(!match) return null;
  return match[0].toLowerCase().replace(/^'+|'+$/g, '');
}

function renderSentence(){
  const [text] = sentences[current];
  sentenceBox.innerHTML = '';
  sentenceBox.classList.toggle('show-gloss', glossOn);
  const parts = text.split(/\s+/).filter(p => p.length > 0);
  const sentLinks = LINKS[String(current)] || [];
  const linkByIndex = {};
  sentLinks.forEach(l => { linkByIndex[l.i] = l; });

  parts.forEach((part, idx) => {
    const key = lookupKey(part);
    if(key && wordDict[key]){
      const unit = document.createElement('span');
      unit.className = 'word-unit';
      const span = document.createElement('span');
      span.className = 'word';
      span.dataset.key = key;
      span.textContent = part;
      span.addEventListener('click', () => onWordTap(span, key));
      const gloss = document.createElement('span');
      gloss.className = 'gloss';
      gloss.textContent = wordDict[key].meaning;
      unit.appendChild(span);
      unit.appendChild(gloss);
      sentenceBox.appendChild(unit);
    } else {
      const span = document.createElement('span');
      span.className = 'punct';
      span.textContent = part;
      sentenceBox.appendChild(span);
    }
    if(idx < parts.length - 1){
      const link = linkByIndex[idx];
      if(link){
        const mark = document.createElement('span');
        mark.className = 'link-mark';
        mark.textContent = '\u203F';
        mark.addEventListener('click', () => {
          mark.classList.add('seen');
          onLinkTap(link);
        });
        sentenceBox.appendChild(mark);
      } else {
        sentenceBox.appendChild(document.createTextNode(' '));
      }
    }
  });
}

function onWordTap(span, key){
  document.querySelectorAll('.word.active').forEach(el => el.classList.remove('active'));
  span.classList.add('active');
  const info = wordDict[key];
  const cleanWord = span.textContent.replace(/[^A-Za-z']/g,'');
  speak(cleanWord, 0.75);

  const phonHtml = info.phon.map(p => {
    let svgs = '';
    if(p.cats.length === 1) svgs = mouthSVG(p.cats[0]);
    else if(p.cats.length === 2) svgs = mouthSVG(p.cats[0]) + '<span class="phon-arrow">→</span>' + mouthSVG(p.cats[1]);
    return `<div class="phon-chip">
      <div class="phon-svgs">${svgs}</div>
      <div class="phon-sym">${p.sym}</div>
      <div class="phon-desc">${p.desc}</div>
    </div>`;
  }).join('');

  helperBox.classList.remove('placeholder');
  helperBox.innerHTML = `
    <div class="helper-head">
      <span class="word-en">${cleanWord}</span>
      <span class="ipa-full">/ ${info.ipa} /</span>
      <button class="word-listen-btn" id="wordListenBtn">🔊</button>
    </div>
    <div class="phon-row">${phonHtml}</div>
    <div class="meaning-line"><b>뜻</b> ${info.meaning}</div>
    <span class="kor-toggle" id="korToggle">그래도 어려우면 한글로 살짝 참고하기</span>
    <div class="kor-hint" id="korHint">참고용 발음: ${info.kor} (진짜 소리는 위 그림과 발음기호로 익혀보세요!)</div>
  `;
  document.getElementById('korToggle').addEventListener('click', () => {
    document.getElementById('korHint').classList.toggle('show');
  });
  document.getElementById('wordListenBtn').addEventListener('click', () => speak(cleanWord, 0.75));
}

function onLinkTap(link){
  document.querySelectorAll('.word.active').forEach(el => el.classList.remove('active'));
  const cleanPhrase = (link.w1 + ' ' + link.w2).replace(/[^A-Za-z' ]/g,'');
  helperBox.classList.remove('placeholder');
  helperBox.innerHTML = `
    <div class="link-type-tag">${link.typeLabel}</div>
    <div class="link-phrase">${link.w1} ${link.w2} <button class="word-listen-btn" id="linkListenBtn">🔊</button></div>
    <div class="link-sound">🔗 이렇게 이어져요: “${link.sound}”</div>
    <div class="link-desc">${link.desc}</div>
  `;
  document.getElementById('linkListenBtn').addEventListener('click', () => speak(cleanPhrase, 0.7));
}

function resetHelper(){
  helperBox.classList.add('placeholder');
  helperBox.innerHTML = '단어나 ‿ 표시를 톡 누르면 여기에 설명이 나와요';
}

function updateTranslateBtn(){
  translateBtn.textContent = glossOn ? '🙈 우리말 뜻 숨기기' : '🌏 우리말 뜻 보기';
  const tb = document.getElementById('transBox');
  if (tb){
    tb.textContent = sentences[current][1] || '';
    tb.classList.toggle('show', glossOn && !!sentences[current][1]);
  }
}

function render(){
  renderSentence();
  resetHelper();
  updateTranslateBtn();
  buildDots();
  counterText.textContent = (current+1) + ' / ' + sentences.length;
  prevBtn.disabled = current === 0;
  updateNextLock();
  resetJudgeUI();
}

translateBtn.addEventListener('click', () => {
  glossOn = !glossOn;
  sentenceBox.classList.toggle('show-gloss', glossOn);
  updateTranslateBtn();
});
prevBtn.addEventListener('click', () => { if(current > 0){ current--; render(); } });
nextBtn.addEventListener('click', () => { if(current < sentences.length - 1){ current++; render(); } });

// ================= 챕터 전환 / 읽기(녹음 + 검사) =================
let chapterKey = 'ch18';
const passed = {}, attempts = {}, clips = {};
function keyFor(i){ return chapterKey + ':' + (i === undefined ? current : i); }

const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null, busy = false, listening = false, recording = false;
let mr = null, mstream = null, chunks = [], audioEl = null, sessionKey = null, stopTimer = null;
const $id = id => document.getElementById(id);
const gateChk = $id('gateChk'), recBtn = $id('recBtn'), judgeBtn = $id('judgeBtn'), recPlayBtn = $id('recPlayBtn');
const recStatus = $id('recStatus'), judgeStatus = $id('judgeStatus'), heardText = $id('heardText');
let sessionMode = 'rec';

function gateActive(){ return !!SRClass && gateChk.checked; }
function updateNextLock(){
  const atEnd = current === sentences.length - 1;
  const locked = gateActive() && !passed[keyFor()];
  nextBtn.disabled = atEnd || locked;
  nextBtn.classList.toggle('locked', !atEnd && locked);
  nextBtn.textContent = (!atEnd && locked) ? '🔒' : '▶';
}
gateChk.addEventListener('change', updateNextLock);

function clearMarks(){ document.querySelectorAll('.word-unit.mismatch, .word-unit.ok').forEach(el => el.classList.remove('mismatch','ok')); }
function removeSkip(){ const l = $id('skipLink'); if(l) l.remove(); }
function setJudge(msg, cls){ judgeStatus.textContent = msg; judgeStatus.className = 'rec-status judge-status' + (cls ? ' ' + cls : ''); }
function setButtons(){
  const recBusy = busy && sessionMode === 'rec', judgeBusy = busy && sessionMode === 'judge';
  recBtn.textContent = recBusy ? '⏹ 끝내기' : (clips[keyFor()] ? '🎙️ 다시 녹음' : '🎙️ 녹음');
  judgeBtn.textContent = judgeBusy ? '⏹ 끝내기' : '🎤 읽기 검사';
  recBtn.classList.toggle('recording', recBusy); judgeBtn.classList.toggle('recording', judgeBusy);
  recBtn.disabled = busy && !recBusy; judgeBtn.disabled = busy && !judgeBusy;
  recPlayBtn.disabled = busy || !clips[keyFor()];
}
function maybeFinish(){ if(!listening && !recording){ busy = false; setButtons(); } }

function resetJudgeUI(){
  clearTimeout(stopTimer);
  if(listening && recognizer){ try{ recognizer.abort(); }catch(e){} }
  if(recording && mr){ try{ mr.stop(); }catch(e){} }
  if(audioEl){ audioEl.pause(); }
  listening = false; busy = recording;   // 녹음 정리가 끝나면 maybeFinish가 busy를 푼다
  if(!recording) busy = false;
  setButtons();
  setJudge(passed[keyFor()] ? '🎉 이 문장은 통과했어요!' : '', passed[keyFor()] ? 'pass' : '');
  heardText.textContent = ''; recStatus.textContent = '';
  clearMarks(); removeSkip();
  if(!SRClass){ setJudge('이 브라우저는 읽기 검사를 지원하지 않아요 (안드로이드/PC 크롬을 써보세요).', ''); }
}

function loadChapter(k){
  chapterKey = k; sentences = CHAPTERS[k].sentences; LINKS = CHAPTERS[k].links; current = 0;
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.toggle('active', b.dataset.k === k));
  if(window.setVocab) window.setVocab(CHAPTERS[k].vocab);
  render();
}
document.querySelectorAll('.ch-btn').forEach(b => b.addEventListener('click', () => { if(b.dataset.k !== chapterKey) loadChapter(b.dataset.k); }));

// ---- 읽기 검사 점수 계산 ----
function normWords(t){ return t.toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean); }
function lev1(a,b){
  if(a===b) return true;
  if(Math.abs(a.length-b.length)>1 || a.length<4 || b.length<4) return false;
  let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++;
  if(a.length===b.length) return a.slice(i+1)===b.slice(i+1);
  return a.length>b.length ? a.slice(i+1)===b.slice(i) : b.slice(i+1)===a.slice(i);
}
function scoreReading(target, heardList){
  const t = normWords(target); let best = {ratio:-1, missed:t, heard:''};
  heardList.forEach(hs => {
    const hw = normWords(hs); const missed = [];
    t.forEach(w => { if(!hw.some(x => lev1(x,w))) missed.push(w); });
    const ratio = t.length ? (t.length - missed.length) / t.length : 1;
    if(ratio > best.ratio) best = {ratio, missed, heard: hs};
  });
  return best;
}
function passLimit(n){ return n <= 3 ? 1.0 : 0.6; }

// ---- 음성 인식(검사) ----
if(SRClass){
  recognizer = new SRClass();
  recognizer.lang = 'en-US'; recognizer.interimResults = false; recognizer.maxAlternatives = 3;
  recognizer.onresult = e => {
    const alts = []; for(let i=0;i<e.results[0].length;i++) alts.push(e.results[0][i].transcript);
    if(sessionKey !== keyFor()) return;
    const target = sentences[current][0];
    const r = scoreReading(target, alts);
    heardText.textContent = '들린 말: ' + r.heard;
    clearMarks();
    document.querySelectorAll('.word-unit').forEach(u => {
      const w = u.querySelector('.word'); if(!w) return;
      u.classList.add(r.missed.includes(w.dataset.key) ? 'mismatch' : 'ok');
    });
    if(r.ratio >= passLimit(normWords(target).length)){
      passed[keyFor()] = true;
      setJudge('🎉 참 잘 읽었어요!', 'pass'); removeSkip(); updateNextLock();
    } else {
      attempts[keyFor()] = (attempts[keyFor()] || 0) + 1;
      setJudge('🤔 주황색 단어를 다시 읽어볼까요? (' + Math.round(r.ratio*100) + '%)', 'fail');
      if(attempts[keyFor()] >= 2 && !$id('skipLink')){
        const l = document.createElement('span'); l.id = 'skipLink'; l.className = 'skip-link';
        l.textContent = '그래도 다음으로 넘어갈래요';
        l.addEventListener('click', () => { passed[keyFor()] = true; setJudge('', ''); clearMarks(); removeSkip(); updateNextLock(); });
        heardText.insertAdjacentElement('afterend', l);
      }
    }
  };
  recognizer.onerror = e => {
    if(e.error === 'aborted') return;
    const m = {'not-allowed':'마이크 사용을 허락해 주세요.','service-not-allowed':'마이크 사용을 허락해 주세요.',
      'no-speech':'소리가 안 들렸어요. 다시 눌러서 읽어볼까요?','network':'인터넷 연결이 필요해요.',
      'audio-capture':'마이크를 찾을 수 없어요.'};
    if(sessionKey === keyFor()) setJudge(m[e.error] || '음성 인식에 문제가 생겼어요. 다시 시도해 주세요.', 'fail');
  };
  recognizer.onend = () => {
    listening = false;
    if(recording){ stopTimer = setTimeout(() => { if(mr && mr.state !== 'inactive') mr.stop(); }, 500); }
    maybeFinish();
  };
}

// ---- 녹음 마무리 ----
function finishRecording(){
  if(mstream) mstream.getTracks().forEach(t => t.stop());
  recording = false;
  const k = sessionKey, same = (k === keyFor());
  const blob = new Blob(chunks, {type: (mr && mr.mimeType) || 'audio/webm'});
  if(blob.size > 1500){
    if(clips[k]) URL.revokeObjectURL(clips[k]);
    clips[k] = URL.createObjectURL(blob);
    if(same) recStatus.textContent = '✅ 녹음 완료! ▶ 버튼으로 들어보세요.';
  } else if(same){
    recStatus.textContent = '녹음된 소리가 거의 없어요. 다시 해볼까요?';
  }
  maybeFinish();
}

// ---- 한 번 누르면 녹음 + 검사 ----
async function startSession(wantRec, wantJudge){
  if(busy){
    if(listening && recognizer){ try{ recognizer.stop(); }catch(e){} }
    if(recording && mr && mr.state !== 'inactive'){ clearTimeout(stopTimer); mr.stop(); }
    return;
  }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  if(audioEl){ audioEl.pause(); }
  if(wantJudge && !recognizer){
    if(!wantRec){ alert('이 브라우저는 읽기 검사를 지원하지 않아요. 안드로이드나 PC의 최신 크롬에서 써보세요.'); return; }
    wantJudge = false;
  }
  sessionKey = keyFor(); sessionMode = wantRec ? 'rec' : 'judge';
  clearMarks(); removeSkip(); heardText.textContent = ''; recStatus.textContent = ''; setJudge('', '');
  if(wantRec){
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)){
      recStatus.textContent = '이 브라우저는 녹음을 지원하지 않아요. https 주소의 크롬/사파리에서 열어 주세요.';
      if(!wantJudge) return; wantRec = false;
    } else {
      try{
        mstream = await navigator.mediaDevices.getUserMedia({audio:true});
        chunks = []; mr = new MediaRecorder(mstream);
        mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
        mr.onstop = finishRecording;
        mr.start(); recording = true;
      }catch(err){
        recStatus.textContent = '마이크를 켤 수 없어요. 마이크 권한을 허용했는지 확인해 주세요.';
        return;
      }
    }
  }
  busy = true; setButtons();
  if(wantJudge){
    try{ recognizer.start(); listening = true; }
    catch(err){ listening = false; setJudge('검사를 시작하지 못했어요. 다시 눌러 주세요.', 'fail'); }
  }
  if(listening) setJudge('🎧 지금 문장을 읽어보세요! 다 읽으면 잠시 기다리거나 ⏹를 눌러요.', '');
  else if(recording) recStatus.textContent = '🎧 녹음 중이에요. 다 읽으면 ⏹를 눌러요.';
  if(!listening && !recording){ busy = false; setButtons(); }
}
recBtn.addEventListener('click', () => startSession(true, false));
judgeBtn.addEventListener('click', () => startSession(false, true));
recPlayBtn.addEventListener('click', () => {
  const u = clips[keyFor()]; if(!u) return;
  if(audioEl){ audioEl.pause(); }
  audioEl = new Audio(u); audioEl.play();
});

render();
</script>
<script>
(function(){
  let ALL = [], deck = [], pos = 0, flipped = false, status = [];
  const $ = id => document.getElementById(id);
  let vocabOn = false;
  const readEls = () => [$('progressRow'), document.querySelector('.card'), document.querySelector('.stage'), $('counterText')];
  function showTab(v){
    vocabOn = v;
    readEls().forEach(e => e.style.display = v ? 'none' : '');
    $('vocabView').style.display = v ? 'block' : 'none';
    $('tabRead').classList.toggle('active', !v); $('tabVocab').classList.toggle('active', v);
    if(v) draw();
  }
  function draw(){
    if(!ALL.length) return;
    const c = ALL[deck[pos]];
    const enLong = c[0].length > 28, koLong = c[1].length > 30;
    const el = $('vCard');
    el.className = 'vcard' + (flipped ? ' flipped' : '');
    el.innerHTML = flipped
      ? `<div class="en" style="font-size:${enLong?'15px':'20px'};color:#9C8C7D;font-weight:800">${c[0]}</div><div class="ko${koLong?' long':''}">${c[1]}</div><div class="taphint">다시 누르면 영어로</div>`
      : `<div class="en${enLong?' long':''}">${c[0]}</div><div class="taphint">👆 눌러서 뜻 보기</div>`;
    const known = status.filter(s=>s===1).length, dunno = status.filter(s=>s===-1).length;
    $('vInfo').textContent = (pos+1) + ' / ' + deck.length + '   (알아요 ' + known + ' · 몰라요 ' + dunno + ')';
    $('vPrev').disabled = pos===0; $('vNext').disabled = pos===deck.length-1;
  }
  function go(d){ const n = pos + d; if(n>=0 && n<deck.length){ pos = n; flipped = false; draw(); } }
  window.setVocab = function(cards){
    ALL = cards; deck = ALL.map((_,i)=>i); pos = 0; flipped = false; status = new Array(ALL.length).fill(0);
    if(vocabOn) draw();
  };
  $('tabRead').onclick = () => showTab(false);
  $('tabVocab').onclick = () => showTab(true);
  $('vCard').onclick = () => { flipped = !flipped; draw(); };
  $('vPrev').onclick = () => go(-1);
  $('vNext').onclick = () => go(1);
  $('vKnow').onclick = () => { status[deck[pos]] = 1; if(pos<deck.length-1) go(1); else draw(); };
  $('vDunno').onclick = () => { status[deck[pos]] = -1; if(pos<deck.length-1) go(1); else draw(); };
  $('vSound').onclick = () => { speak(ALL[deck[pos]][0].replace(/[\/\-~=]/g,' '), 0.8); };
  $('vShuffle').onclick = () => {
    deck = ALL.map((_,i)=>i);
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
    pos = 0; flipped = false; draw();
  };
  $('vReview').onclick = () => {
    const d = ALL.map((_,i)=>i).filter(i => status[i] !== 1);
    if(d.length === 0){ alert('🎉 24개 모두 알아요! 대단해요!'); return; }
    deck = d; pos = 0; flipped = false; draw();
  };
  window.setVocab([["escape", "도망치다"], ["every Tuesday", "매주 화요일"], ["take a notice", "알아차리다"], ["long", "긴, 열망하다"], ["weird", "이상한"], ["fluff", "보풀, 부풀리다"], ["as monkey trainers", "원숭이 조련사로서"], ["Good heavens", "(하느님) 맙소사! (놀라움·짜증스러움을 나타냄)"], ["faint", "희미한, 기절하다"], ["miserable", "비참한"], ["magnificent", "참으로 아름다운, 정말 멋진"], ["grandly", "웅장하게"], ["retire", "은퇴하다"], ["true / truly", "진실한 / 진실하게"], ["language", "언어"], ["revolting", "혐오스러운, 역겨운"], ["holiday", "휴일"], ["how to talk to these English birds", "어떻게 이 영국 새들에게 말하는지, 이 영국 새들에게 말하는 방법"], ["get free / be free", "자유로워지다 / (이미) 자유로운 상태이다"], ["finish up", "(결국) …에 이르다[…하게 되다]"], ["expensive", "비싼"], ["somewhere else", "다른 어딘가에"], ["feather", "깃털"], ["You must warn them not to perch on that tree.", "너는 그들에게 저 나무에 걸터앉지 말라고 경고해야 한다."]]);
})();
</script>
