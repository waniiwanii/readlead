const story = [["My second story is about love and loss.", "제 두 번째 이야기는 사랑과 상실에 관한 것입니다."], ["I was lucky — I found what I loved to do early in life.", "저는 운이 좋았습니다. 어릴 때부터 제가 정말 좋아하는 일을 찾았으니까요."], ["Woz and I started Apple in my parents’ garage when I was 20.", "스무 살 때 워즈와 저는 부모님 집 차고에서 애플을 시작했습니다."], ["We worked hard, and in 10 years Apple had grown from just the two of us in a garage into a $2 billion company with over 4,000 employees.", "우리는 열심히 일했고, 10년 만에 애플은 차고에서 두 사람이 시작한 곳에서 직원 4천 명이 넘는 20억 달러 규모의 회사로 성장했습니다."], ["We had just released our finest creation — the Macintosh — a year earlier, and I had just turned 30.", "우리는 1년 전에 최고의 작품인 매킨토시를 출시했고, 저는 막 서른 살이 되었습니다."], ["And then I got fired.", "그런데 저는 해고됐습니다."], ["How can you get fired from a company you started?", "자기가 세운 회사에서 어떻게 해고될 수 있을까요?"], ["Well, as Apple grew we hired someone who I thought was very talented to run the company with me, and for the first year or so things went well.", "애플이 성장하면서 저와 함께 회사를 운영할 재능 있는 사람을 고용했고, 처음 1년쯤은 일이 잘 풀렸습니다."], ["But then our visions of the future began to diverge and eventually we had a falling out.", "하지만 우리가 그리는 미래가 달라지기 시작했고, 결국 사이가 틀어졌습니다."], ["When we did, our Board of Directors sided with him.", "그때 이사회는 그의 편에 섰습니다."], ["So at 30 I was out.", "그래서 저는 서른 살에 회사를 떠나야 했습니다."], ["And very publicly out.", "그 사실을 세상 사람들이 다 알았습니다."], ["What had been the focus of my entire adult life was gone, and it was devastating.", "성인이 된 뒤 제 삶의 중심이었던 일이 사라졌고, 저는 큰 충격을 받았습니다."], ["I really didn’t know what to do for a few months.", "몇 달 동안 정말 무엇을 해야 할지 몰랐습니다."], ["I felt that I had let the previous generation of entrepreneurs down — that I had dropped the baton as it was being passed to me.", "앞 세대의 창업가들을 실망시킨 기분이었습니다. 그들이 건네준 바통을 제가 떨어뜨린 것 같았습니다."], ["I met with David Packard and Bob Noyce and tried to apologize for screwing up so badly.", "데이비드 패커드와 밥 노이스를 만나 일을 그렇게 망친 것에 대해 사과하려 했습니다."], ["I was a very public failure, and I even thought about running away from the valley.", "제 실패를 세상 사람들이 다 알았고, 실리콘밸리를 떠날 생각까지 했습니다."], ["But something slowly began to dawn on me — I still loved what I did.", "하지만 한 가지가 서서히 분명해졌습니다. 저는 여전히 제가 하던 일을 사랑했습니다."], ["The turn of events at Apple had not changed that one bit.", "애플에서 벌어진 일도 그 마음을 조금도 바꾸지 못했습니다."], ["I had been rejected, but I was still in love.", "저는 내쳐졌지만, 그 일은 여전히 좋았습니다."], ["And so I decided to start over.", "그래서 다시 시작하기로 했습니다."], ["I didn’t see it then, but it turned out that getting fired from Apple was the best thing that could have ever happened to me.", "그때는 몰랐지만, 애플에서 해고된 일은 제게 일어날 수 있었던 최고의 일이었습니다."], ["The heaviness of being successful was replaced by the lightness of being a beginner again, less sure about everything.", "성공한 사람이라는 부담이 사라지고, 모든 것이 조금 낯선 초보자로 돌아가니 마음이 가벼워졌습니다."], ["It freed me to enter one of the most creative periods of my life.", "덕분에 저는 인생에서 가장 창의적이었던 시기 중 하나를 맞을 수 있었습니다."], ["During the next five years, I started a company named NeXT, another company named Pixar, and fell in love with an amazing woman who would become my wife.", "그 뒤 5년 동안 넥스트와 픽사라는 회사를 세웠고, 훗날 제 아내가 된 멋진 여성과 사랑에 빠졌습니다."], ["Pixar went on to create the world’s first computer animated feature film, Toy Story, and is now the most successful animation studio in the world.", "픽사는 세계 최초의 컴퓨터 장편 애니메이션인 토이 스토리를 만들었고, 지금은 세계에서 가장 성공한 애니메이션 제작사입니다."], ["In a remarkable turn of events, Apple bought NeXT, I returned to Apple, and the technology we developed at NeXT is at the heart of Apple’s current renaissance.", "놀랍게도 애플은 넥스트를 인수했고, 저는 애플로 돌아갔습니다. 넥스트에서 개발한 기술은 지금 애플이 다시 성장하는 데 핵심이 되었습니다."], ["And Laurene and I have a wonderful family together.", "로린과 저는 함께 행복한 가정을 이루었습니다."], ["I’m pretty sure none of this would have happened if I hadn’t been fired from Apple.", "애플에서 해고되지 않았다면 이 일들은 하나도 일어나지 않았을 거라고 생각합니다."], ["It was awful tasting medicine, but I guess the patient needed it.", "맛은 끔찍한 약이었지만, 환자인 제게는 필요한 약이었던 것 같습니다."], ["Sometimes life hits you in the head with a brick.", "살다 보면 벽돌로 머리를 맞은 듯한 일이 생기기도 합니다."], ["Don’t lose faith.", "믿음을 잃지 마세요."], ["I’m convinced that the only thing that kept me going was that I loved what I did.", "제가 계속 나아갈 수 있었던 건 제가 하던 일을 사랑했기 때문이라고 확신합니다."], ["You’ve got to find what you love.", "여러분이 사랑하는 것을 찾아야 합니다."], ["And that is as true for your work as it is for your lovers.", "사랑하는 사람을 찾는 것만큼 일에서도 그렇습니다."], ["Your work is going to fill a large part of your life, and the only way to be truly satisfied is to do what you believe is great work.", "일은 여러분 인생의 큰 부분을 차지합니다. 진정으로 만족하려면 스스로 훌륭하다고 믿는 일을 해야 합니다."], ["And the only way to do great work is to love what you do.", "그리고 훌륭한 일을 하려면 자신이 하는 일을 사랑해야 합니다."], ["If you haven’t found it yet, keep looking.", "아직 찾지 못했다면 계속 찾아보세요."], ["Don’t settle.", "아무 일에나 안주하지 마세요."], ["As with all matters of the heart, you’ll know when you find it.", "마음이 움직이는 일이라면, 찾았을 때 스스로 알아차릴 겁니다."], ["And, like any great relationship, it just gets better and better as the years roll on.", "좋은 관계가 그렇듯, 시간이 흐를수록 점점 더 좋아질 겁니다."], ["So keep looking until you find it.", "그러니 찾을 때까지 계속 찾아보세요."], ["Don’t settle.", "아무 일에나 안주하지 마세요."]];

function stopAudio() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  $('soundStatus').textContent = '';
}

function speak(text, rate) {
  stopAudio();
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
    $('soundStatus').textContent = '이 화면은 소리 재생을 지원하지 않아요. 다운로드한 파일을 크롬에서 열어 보세요.';
    return;
  }
  const message = new SpeechSynthesisUtterance(text);
  message.lang = 'en-US';
  const voices = speechSynthesis.getVoices();
  message.voice = voices.find(voice => voice.lang === 'en-US') || voices.find(voice => voice.lang.startsWith('en')) || null;
  message.rate = rate;
  message.onerror = event => {
    if (!['canceled', 'interrupted'].includes(event.error)) $('soundStatus').textContent = '소리를 재생하지 못했어요. 크롬과 기기의 영어 음성 설정을 확인해 주세요.';
  };
  speechSynthesis.speak(message);
}

function appendWordButton(container, word, onSelect) {
  const button = document.createElement('button');
  button.className = 'tapWord';
  button.type = 'button';
  button.textContent = word;
  button.setAttribute('aria-pressed', 'false');
  button.onclick = () => {
    container.querySelector('[aria-pressed="true"]')?.setAttribute('aria-pressed', 'false');
    button.setAttribute('aria-pressed', 'true');
    onSelect();
  };
  container.append(button);
}

function renderSentenceWords(text) {
  const box = $('sentenceText');
  const lookup = $('wordLookup');
  box.replaceChildren();
  lookup.replaceChildren();
  lookup.hidden = true;
  const context = phraseGloss[sentence + 1] || [];
  let end = 0;
  for (const match of text.matchAll(/\$?\d+(?:,\d+)*|[a-zA-Z]+(?:[’'][a-zA-Z]+)*/g)) {
    const token = match[0];
    box.append(text.slice(end, match.index));
    end = match.index + token.length;
    appendWordButton(box, token, () => {
      const key = token.toLowerCase().replace('’', "'");
      const name = document.createElement('strong');
      name.lang = 'en';
      name.textContent = token;
      const phrase = context.find(([part]) => {
        let start = text.indexOf(part);
        while (start !== -1) {
          if (match.index >= start && endOfToken <= start + part.length) return true;
          start = text.indexOf(part, start + part.length);
        }
        return false;
      });
      lookup.replaceChildren(name, ' · ' + wordGloss[key]);
      if (phrase) {
        const detail = document.createElement('span');
        detail.style.display = 'block';
        const expression = document.createElement('strong');
        expression.lang = 'en';
        expression.textContent = phrase[0];
        detail.append(expression, ' · ' + phrase[1]);
        lookup.append(detail);
      }
      lookup.hidden = false;
      speak(token, .8);
    });
    const endOfToken = end;
  }
  box.append(text.slice(end));
}

function renderRead() {
  renderSentenceWords(story[sentence][0]);

  $('readBar').value = finished.size;
  $('prevSentence').disabled = sentence === 0;

}

function moveSentence(index) {

function renderWord() {
  const [en, ko] = vocabulary[word];
  $('wordProgress').textContent = `이 범위 ${word - rangeStart + 1} / ${rangeEnd - rangeStart} · 단어장 ${word + 1}번`;
  const card = $('wordText');
  card.replaceChildren();
  if (writing) card.textContent = ko;
  else en.split(' / ').forEach((part, index) => {
    if (index) card.append(' / ');
    appendWordButton(card, part, () => revealCardMeaning(part, ko.split(' / ')[index] || ko));
  });
  $('wordText').lang = writing ? 'ko' : 'en';
  $('wordMeaning').textContent = ko;
  $('wordMeaning').hidden = true;
  $('showMeaning').textContent = '뜻 보기';
  $('showMeaning').setAttribute('aria-expanded', 'false');
  $('flashControls').hidden = writing;
  $('writeForm').hidden = !writing;
  $('writeHint').textContent = en.includes('/') ? '영어 두 개를 순서대로 써요. 사이에는 / 또는 쉼표를 넣어요.' : '우리말 뜻을 보고 영어를 써요.';
  $('answer').value = '';
  $('answerResult').textContent = '';
  $('prevWord').disabled = word === rangeStart;
  $('nextWord').disabled = word === rangeEnd - 1;
}

function moveWord(index) {
  if (index < rangeStart || index >= rangeEnd) return;
  stopAudio();
  word = index;
  renderWord();
}

function setMode(write) {
  stopAudio();
  writing = write;
  $('flashMode').setAttribute('aria-pressed', !write);
  $('writeMode').setAttribute('aria-pressed', write);
  renderWord();
}

function toggleMeaning(panel, button) {
  panel.hidden = !panel.hidden;
  button.textContent = panel.hidden ? '뜻 보기' : '뜻 숨기기';
  button.setAttribute('aria-expanded', !panel.hidden);
}

function normalize(answer) {
  return answer.trim().toLowerCase().replace(/\s*[,/]\s*/g, '/').replace(/\s+/g, ' ');
}

story.forEach((_, i) => $('sentenceSelect').add(new Option(`${i + 1}번`, i)));
vocabulary.forEach(([en, ko]) => {
  const item = document.createElement('li');
  const english = document.createElement('strong');
  english.lang = 'en';
  english.textContent = en;
  item.append(english, ' · ' + ko);
  $('wordList').append(item);
});
$('readBar').max = story.length;
$('sentenceSelect').onchange = event => moveSentence(Number(event.target.value));
$('prevSentence').onclick = () => moveSentence(sentence - 1);
$('nextSentence').onclick = () => moveSentence(sentence + 1);
$('sentenceAudio').onclick = () => speak(story[sentence][0], .88);
$('slowAudio').onclick = () => speak(story[sentence][0], .65);
$('translate').onclick = () => toggleMeaning($('translation'), $('translate'));
$('markRead').onclick = () => {
  if (finished.has(sentence)) finished.delete(sentence);
  else finished.add(sentence);
  try { localStorage.setItem('steve-jobs-story-2-read', JSON.stringify([...finished])); } catch {}
  renderRead();
};
$('readTab').onclick = () => showTab(true);
$('wordTab').onclick = () => showTab(false);
$('wordRange').onchange = event => {
  const choice = event.target.value;
  rangeStart = choice === 'all' ? 0 : Number(choice);
  rangeEnd = choice === 'all' ? vocabulary.length : rangeStart + 8;
  moveWord(rangeStart);
};
$('flashMode').onclick = () => setMode(false);
$('writeMode').onclick = () => setMode(true);
$('prevWord').onclick = () => moveWord(word - 1);
$('nextWord').onclick = () => moveWord(word + 1);
function revealCardMeaning(spoken, meaning) {
  $('wordMeaning').textContent = meaning;
  $('wordMeaning').hidden = false;
  $('showMeaning').textContent = '뜻 숨기기';
  $('showMeaning').setAttribute('aria-expanded', 'true');
  speak(spoken, .82);
}
$('wordAudio').onclick = () => {
  const [en, ko] = vocabulary[word];
  $('wordText').querySelector('[aria-pressed="true"]')?.setAttribute('aria-pressed', 'false');
  revealCardMeaning(en.replace(' / ', '. '), ko);
};
$('showMeaning').onclick = () => {
  if ($('wordMeaning').hidden) $('wordMeaning').textContent = vocabulary[word][1];
  toggleMeaning($('wordMeaning'), $('showMeaning'));
};
$('writeForm').onsubmit = event => {
  event.preventDefault();
  const answer = normalize($('answer').value);
  $('answerResult').textContent = !answer ? '먼저 영어를 써 보세요.' :
    answer === normalize(vocabulary[word][0]) ? '✓ 맞았어요!' : '철자를 한 번 더 떠올려 보세요.';
};
$('showAnswer').onclick = () => { $('answerResult').textContent = vocabulary[word][0]; };
renderRead();
renderWord();
</script>
</body>
</html>
